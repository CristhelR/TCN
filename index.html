<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcultural Nursing Exam</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#5b6b7a;--line:#d9e0e6;--pri:#0b6b63;--pri-ink:#fff;--warn:#b45309;--bad:#b3261e;--ok:#1b7f3b;--sel:#e3f3f1}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222a;--ink:#e8eef2;--mut:#9fb0bd;--line:#2b3a46;--pri:#3fb6a8;--pri-ink:#06201d;--warn:#f2a444;--bad:#ff8a80;--ok:#6fd48a;--sel:#173833}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
h2{font-size:1.2rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.tm{font:700 1.7rem/1 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tm.warn{color:var(--warn)}.tm.danger{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .25s linear}
.bar.t i{background:var(--warn)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt.on{background:var(--sel);border-color:var(--pri)}
.k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt.on .k{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.act{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:.85rem;flex:1 1 220px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
label.f{display:block;margin-top:12px;font-weight:600}
input[type=text]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
ul.rules{padding-left:1.1rem;margin:8px 0}
ul.rules li{margin:6px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.chk input{margin-top:5px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;place-items:center;padding:20px}
.ov.show{display:grid}
.ovc{max-width:460px;text-align:center}
.big{font-size:3rem;font-weight:800;line-height:1.1}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0}
.stat div span{display:block;color:var(--mut);font-size:.85rem}
.stat div b{font-size:1.2rem}
.code{font:700 1.1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.rv{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rv small{color:var(--mut)}
.bad{color:var(--bad)}.ok{color:var(--ok)}
#wm{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.12}
@media print{body{display:none!important}}
</style>
</head>

var SKEY='tch_exam_state_v1';
var $=function(s){return document.querySelector(s)};
var app=$('#app'),ov=$('#ov');
var S=null,lastV=0,busy=false;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).toUpperCase().padStart(8,'0')}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function load(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function reqFS(){
  var el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!r){S.fs=false;save();return}
  try{var p=r.call(el);S.fs=true;if(p&&p.catch)p.catch(function(){S.fs=false;save()})}catch(e){S.fs=false}
  save();
}
function score(){var c=0;S.order.forEach(function(qi,i){if(S.ans[i]===BANK[qi].a)c++});return c}

  var n=BANK.length;
  app.innerHTML='<h1>'+esc(CFG.TITLE)+'</h1><p class="sub">'+esc(CFG.SUBTITLE)+'</p>'+
  '<section class="card"><h2>Before you begin</h2><ul class="rules">'+

  '<li>The exam runs in full screen. Switching tabs or apps, leaving full screen, or losing focus is recorded as a violation. <b>'+CFG.MAX+' violations end the exam</b> and submit your answers as they are.</li>'+

  '<div class="act"><span class="hint">Starting puts your browser in full screen.</span><button class="btn" id="go" disabled>Start exam</button></div></section>';
  var go=$('#go');
  function chk(){go.disabled=!($('#nm').value.trim()&&$('#id').value.trim()&&$('#ok').checked)}
  ['#nm','#id','#ok'].forEach(function(s){$(s).addEventListener('input',chk);$(s).addEventListener('change',chk)});
  go.onclick=function(){if(go.disabled)return;begin($('#nm').value.trim(),$('#id').value.trim())};
}

function begin(name,id){
  var seed=(Math.random()*4294967296)>>>0,r=rng(seed);
  var order=shuffle(BANK.map(function(_,i){return i}),r);
  var opts=order.map(function(){return shuffle([0,1,2,3],r)});
  S={name:name,id:id,seed:seed,order:order,opts:opts,ans:order.map(function(){return null}),i:0,pick:null,
     deadline:Date.now()+CFG.T*1000,viol:0,log:[],started:Date.now(),done:false,fs:false,status:''};
  save();reqFS();watermark();renderQ();
}

function renderQ(){
  var n=BANK.length,q=BANK[S.order[S.i]],o=S.opts[S.i],last=S.i===n-1;
  app.innerHTML='<div class="top"><div><b>Item '+(S.i+1)+'</b> of '+n+'</div><div id="tm" class="tm" aria-live="off">'+fmt(CFG.T)+'</div></div>'+

  '<div class="bar t" aria-hidden="true"><i id="tb" style="width:100%"></i></div>'+
  '<section class="card"><p class="q">'+esc(q.p)+'</p><div id="opts" role="radiogroup">'+
  o.map(function(oi,pos){return '<button class="opt" role="radio" aria-checked="false" data-p="'+pos+'"><span class="k">'+'ABCD'[pos]+'</span><span>'+esc(q.o[oi])+'</span></button>'}).join('')+
  '</div><div class="act"><span class="hint">Keys: A-D or 1-4 to choose, Enter to confirm. No going back.</span>'+
  '<button class="btn" id="nx" disabled>'+(last?'Finish exam':'Confirm and next')+'</button></div></section>';
  var nx=$('#nx');
  function mark(){
    document.querySelectorAll('.opt').forEach(function(b){var on=+b.dataset.p===S.pick;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
    nx.disabled=S.pick==null;
  }
  document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){S.pick=+b.dataset.p;save();mark()}});
  nx.onclick=function(){if(S.pick!=null)advance()};
  mark();tick();
}

function advance(){
  if(busy||S.done)return;busy=true;
  var n=BANK.length;
  S.ans[S.i]=S.pick!=null?S.opts[S.i][S.pick]:null;S.pick=null;S.i++;
  if(S.i>=n){busy=false;finish('completed');return}
  S.deadline=Date.now()+CFG.T*1000;save();renderQ();busy=false;
}

function tick(){
  if(!S||S.done||!$('#tm'))return;
  var rem=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));
  var tm=$('#tm'),tb=$('#tb');
  tm.textContent=fmt(rem);
  tm.className='tm'+(rem<=10?' danger':rem<=30?' warn':'');
  tb.style.width=(rem/CFG.T*100)+'%';
  if(rem<=0)advance();
}
setInterval(tick,250);

function catchUp(){
  var n=BANK.length;
  while(!S.done&&Date.now()>=S.deadline){
    S.ans[S.i]=S.pick!=null?S.opts[S.i][S.pick]:null;S.pick=null;S.i++;
    if(S.i>=n){finish('completed');return}
    S.deadline+=CFG.T*1000;
  }
  save();
}

function finish(st){
  if(S.done)return;
  S.done=true;S.status=st;S.end=Date.now();save();
  ov.classList.remove('show');
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
  renderResult();
}

function integrity(sc){return fnv([S.name,S.id,sc,S.viol,S.end,S.ans.join('.'),S.seed,'tch26'].join('|'))}

function reportText(){
  var n=BANK.length,sc=score(),L=[];
  L.push(CFG.TITLE,CFG.SUBTITLE,'');
  L.push('Name: '+S.name,'ID / Section: '+S.id);
  L.push('Started: '+new Date(S.started).toLocaleString(),'Ended: '+new Date(S.end).toLocaleString());
  L.push('Status: '+(S.status==='completed'?'Completed':'Ended automatically (violation limit)'));
  L.push('Score: '+sc+' / '+n+' ('+(Math.round(sc/n*1000)/10)+'%)');
  L.push('Violations: '+S.viol);
  S.log.forEach(function(v){L.push('  - Item '+v.q+' at '+new Date(v.t).toLocaleTimeString()+': '+v.why)});
  L.push('Integrity code: '+integrity(sc),'');
  L.push('Item results (original item number in the question bank):');
  S.order.forEach(function(qi,i){
    var a=S.ans[i];
    L.push('  #'+(qi+1)+' (asked '+(i+1)+'): '+(a==null?'No answer':a===BANK[qi].a?'Correct':'Incorrect'));
  });
  return L.join('\n');
}

function download(){
  var b=new Blob([reportText()],{type:'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='Exam_'+S.name.replace(/[^\w]+/g,'_')+'.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

function renderResult(){
  var n=BANK.length,sc=score(),pct=Math.round(sc/n*1000)/10;
  var h='<h1>'+esc(CFG.TITLE)+'</h1><p class="sub">'+esc(S.name)+' | '+esc(S.id)+'</p>'+
  '<section class="card"><h2>'+(S.status==='completed'?'Exam completed':'Exam ended automatically')+'</h2>'+
  (S.status==='completed'?'':'<p class="bad">The violation limit was reached, so your answers were submitted as they were.</p>')+
  '<div class="stat"><div><span>Score</span><b>'+sc+' / '+n+'</b></div><div><span>Percent</span><b>'+pct+'%</b></div><div><span>Violations</span><b>'+S.viol+'</b></div></div>'+
  '<p>Integrity code: <span class="code">'+integrity(sc)+'</span></p>'+
  '<p class="sub">Download your result file and send it to your teacher. Editing the file or the code will not match the original.</p>'+
  '<div class="act"><span class="hint">Your result is also saved in this browser. Reopening this page shows it again.</span><button class="btn" id="dl">Download result file</button></div></section>';
  if(CFG.REVIEW){
    var rv='';
    S.order.forEach(function(qi,i){
      var q=BANK[qi],a=S.ans[i];
      if(a===q.a)return;
      rv+='<div class="rv"><b>'+esc(q.p)+'</b><br><span class="bad">Your answer: '+(a==null?'none':esc(q.o[a]))+'</span><br><span class="ok">Correct: '+esc(q.o[q.a])+'</span><br><small>'+esc(q.e)+'</small></div>';
    });
    h+='<section class="card"><h2>Items to review</h2>'+(rv||'<p>No missed items.</p>')+'</section>';
  }
  app.innerHTML=h;
  $('#dl').onclick=download;
}

/* ===== Integrity controls ===== */
function violation(why){
  if(!S||S.done||!S.started)return;
  var now=Date.now();if(now-lastV<1500)return;lastV=now;
  S.viol++;S.log.push({t:new Date().toISOString(),q:S.i+1,why:why});save();
  if(S.viol>=CFG.MAX){finish('terminated');return}
  var left=CFG.MAX-S.viol;
  ov.innerHTML='<div class="ovc"><div class="big bad" aria-hidden="true">!</div><h2>Warning '+S.viol+' of '+CFG.MAX+'</h2>'+
    '<p>'+esc(why)+'. This was recorded.</p>'+
    '<p>'+left+' more violation'+(left>1?'s':'')+' will end your exam. <b>Your timer is still running.</b></p>'+
    '<button class="btn" id="rt">Return to exam</button></div>';
  ov.classList.add('show');
  $('#rt').onclick=function(){if(S.fs)reqFS();ov.classList.remove('show')};
  $('#rt').focus();
}

document.addEventListener('visibilitychange',function(){if(document.hidden)violation('You switched to another tab or window')});
window.addEventListener('blur',function(){violation('The exam window lost focus')});
['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
  document.addEventListener(ev,function(){if(S&&S.started&&!S.done&&S.fs&&!fsEl())violation('You left full screen mode')});
});
window.addEventListener('beforeunload',function(e){if(S&&S.started&&!S.done){e.preventDefault();e.returnValue=''}});

['copy','cut','paste'].forEach(function(ev){
  document.addEventListener(ev,function(e){e.preventDefault();try{e.clipboardData.setData('text/plain','')}catch(x){}});
});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('dragstart',function(e){e.preventDefault()});
document.addEventListener('selectstart',function(e){if(!(e.target.closest&&e.target.closest('input')))e.preventDefault()});

document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey,inField=e.target&&e.target.tagName==='INPUT';
  if(k==='f12'||(c&&e.shiftKey&&['i','j','c','k'].indexOf(k)>-1)||(c&&['c','v','x','a','s','p','u','f'].indexOf(k)>-1)||(e.metaKey&&e.altKey&&k==='i')){e.preventDefault();e.stopPropagation();return}
  if(inField||c||e.altKey)return;
  if(S&&S.started&&!S.done&&!ov.classList.contains('show')){
    var idx='abcd'.indexOf(k);if(idx<0)idx='1234'.indexOf(k);
    if(idx>-1){var b=document.querySelector('.opt[data-p="'+idx+'"]');if(b){b.click();e.preventDefault()}}
    else if(k==='enter'){var nx=$('#nx');if(nx&&!nx.disabled){nx.click();e.preventDefault()}}
  }
},true);
document.addEventListener('keyup',function(e){
  if(e.key==='PrintScreen'){try{navigator.clipboard.writeText(' ')}catch(x){}violation('Screenshot key pressed')}
});

function watermark(){
  var t=esc(S.name+'  |  '+S.id);
  var svg="<svg xmlns='http://www.w3.org/2000/svg' width='340' height='180'><text x='10' y='110' transform='rotate(-22 170 90)' font-family='sans-serif' font-size='17' fill='#777'>"+t+"</text></svg>";
  $('#wm').style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}

/* ===== Start ===== */
function doReset(){try{localStorage.removeItem(SKEY)}catch(e){}history.replaceState(null,'',location.pathname+location.search)}
if(location.hash==='#reset')doReset();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){doReset();location.reload()}});
S=load();
if(!S){renderIntro()}
else if(S.done){watermark();renderResult()}
else{
  watermark();catchUp();
  if(!S.done){renderQ();violation('The page was refreshed or reopened')}
}
})();
</script>
</body>
</html>
